[package]
name = "vim-sandbox"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = { version = "0.28", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
anyhow = "1.0"
rand = "0.8"
rand_chacha = "0.3"
futures-util = "0.3"