[package]
name = "vim-sandbox"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = { version = "0.28", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
mlua = { version = "0.9", features = ["send", "async", "serialize", "luau"] }
libloading = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = { version = "0.8", features = ["small_rng"] }
rand_chacha = "0.3"
dirs = "5.0"
notify = { version = "6", features = ["mio"] }
futures = "0.3"
futures-util = "0.3"